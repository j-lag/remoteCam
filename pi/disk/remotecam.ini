; =====================================================================
;  RemoteCam - configuration
;  Edit this file and save it: the Raspberry Pi applies the changes
;  within ~10 seconds (no need to unplug it).
;  Lines starting with ; or # are comments.
; =====================================================================

[general]
; WiFi country code (2 letters, required to enable WiFi): FR, DE, GB, US...
country = FR
; Name shown in the PC application (empty = RemoteCam-XXXX)
name =
; Optional key (letters, digits, . _ -): the PC must enter the same one
key =

; ---------------------------------------------------------------------
;  WiFi networks (the network of the PC running the sender application).
;  Several sections allowed: [wifi1], [wifi2]... (order = priority)
;  security = psk (WPA2/WPA3 personal, default) | open | peap (enterprise)
; ---------------------------------------------------------------------
[wifi1]
ssid =
password =
; hidden = yes
; security = psk

;[wifi2]
;ssid = OtherNetwork
;password = secret

;[wifi3]
;ssid = CorporateNetwork
;security = peap
;identity = user
;password = secret

; ---------------------------------------------------------------------
;  Camera (any change here makes the USB device re-enumerate)
; ---------------------------------------------------------------------
[camera]
; Resolutions offered to the video application (Teams...)
resolutions = 1920x1080, 1280x720, 640x360
; auto: also offer the native resolution of the PC screen
native = auto
; Maximum frame rate offered: 30, 25, 20, 15, 10 or 5
max_fps = 30
; USB isochronous packet size: 1024 (safe) or 2048 (more bandwidth; 3072 does not work on a Pi Zero)
usb_maxpacket = 2048
; Maximum JPEG size declared per frame, in bits per pixel (1 to 8, default 2).
; Windows picks the frame rates it allows from this size and the USB bandwidth:
; lower = higher frame rates offered, but the PC must compress more to fit.
frame_bpp = 1
; Webcam name shown by Windows / Teams
usb_name = RemoteCam
